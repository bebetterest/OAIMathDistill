# Direct text uses the same API and thinking settings as the default TeX workflow.
project_root = "../.."
source_root = "math"

[run]
output = "runs/deepseek-fragment"
concurrency = 1

[backends.deepseek]
kind = "chat"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
env_file = ".env"
timeout = 600
# Includes provider thinking and the final JSON; increase if a response is truncated.
max_tokens = 32768
json_mode = true

[backends.deepseek.extra]
thinking = {type = "enabled"}
reasoning_effort = "high"

[generation]
backend = "deepseek"

[review]
# A separate request with the same model/settings. Use another named backend to override.
backend = "deepseek"

[[sources]]
id = "definition"
mode = "fragment"
text = "For positive real x, division by x is defined and x/x = 1."

[[methods]]
name = "reading"
params = {count = 1, form = "qa"}
